; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; A porta e fixada de proposito. A deteccao automatica do PlatformIO lista as
; portas seriais do Bluetooth junto com as reais, e quando a placa nao esta
; conectada ela escolhe uma delas e o upload falha com
; "Could not open COM3 ... o tempo limite do semaforo expirou".
;
; Se a placa mudar de porta (outro conector USB, por exemplo), descubra a nova
; com "pio device list" e troque aqui. A certa e a que tem
; Hardware ID: USB\VID_10C4&PID_EA60 (chip CP2102).
upload_port = COM5
monitor_port = COM5